<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="100%" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title>Least privilege: a read-only capability</title>
  <desc>A tool is granted a read-only capability. Reading the corpus is in scope and allowed; writing a file and opening a socket are not granted, so the tool physically cannot do them. It is not a runtime check that could be tricked past; the capability is simply absent.</desc>
  <rect x="1" y="1" width="698" height="258" rx="10" fill="#fbfcfe" stroke="#d9e2ec" stroke-width="1"/>

  <rect x="30" y="92" width="190" height="76" rx="8" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <text x="125" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#243b53">event_extractor</text>
  <text x="125" y="146" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="600">capability: READ-ONLY</text>

  <line x1="220" y1="130" x2="268" y2="80" stroke="#334e68" stroke-width="1.4" marker-end="url(#lph)"/>
  <line x1="220" y1="130" x2="268" y2="130" stroke="#334e68" stroke-width="1.4" marker-end="url(#lph)"/>
  <line x1="220" y1="130" x2="268" y2="180" stroke="#334e68" stroke-width="1.4" marker-end="url(#lph)"/>

  <text x="280" y="84" font-size="12.5" font-weight="700" fill="#2563eb">✓</text>
  <text x="298" y="84" font-size="12" fill="#243b53">read the corpus</text>
  <text x="520" y="84" font-size="11" fill="#627d98">in scope</text>

  <text x="280" y="135" font-size="12.5" font-weight="700" fill="#334e68">✗</text>
  <text x="298" y="135" font-size="12" fill="#243b53">write a file</text>
  <text x="520" y="135" font-size="11" fill="#627d98">capability not granted</text>

  <text x="280" y="186" font-size="12.5" font-weight="700" fill="#334e68">✗</text>
  <text x="298" y="186" font-size="12" fill="#243b53">open a network socket</text>
  <text x="520" y="186" font-size="11" fill="#627d98">capability not granted</text>

  <text x="350" y="228" text-anchor="middle" font-size="11" fill="#627d98">not a check it could be tricked past: the write and network powers are simply absent.</text>
  <defs><marker id="lph" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#334e68"/></marker></defs>
</svg>
