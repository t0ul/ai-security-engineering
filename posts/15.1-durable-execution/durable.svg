<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="100%" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title>Durable execution: resume-verify</title>
  <desc>The agent's durable log is a hash chain of completed steps. An attacker flips a recorded human decision from denied to approved. A naive resume trusts the log and would issue the refund the human denied. Resume-verify recomputes the chain, the edited step's hash no longer matches, and the resume is refused rather than entering a forged state.</desc>
  <rect x="1" y="1" width="698" height="318" rx="10" fill="#fbfcfe" stroke="#d9e2ec" stroke-width="1"/>
  <text x="24" y="38" font-size="11" font-weight="700" fill="#627d98">THE DURABLE STEP LOG (hash-chained)</text>

  <rect x="24" y="52" width="176" height="60" rx="8" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <text x="112" y="76" text-anchor="middle" font-size="11" font-weight="600" fill="#243b53">refund planned</text>
  <text x="112" y="96" text-anchor="middle" font-size="10" fill="#627d98">step 1 · h1</text>
  <line x1="200" y1="82" x2="226" y2="82" stroke="#334e68" stroke-width="1.5"/><text x="213" y="76" text-anchor="middle" font-size="10" fill="#627d98">#</text>

  <rect x="228" y="52" width="200" height="60" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="328" y="74" text-anchor="middle" font-size="11" font-weight="600" fill="#243b53">human decision: DENIED</text>
  <text x="328" y="94" text-anchor="middle" font-size="10" fill="#627d98">attacker flips to "approved"</text>
  <rect x="356" y="42" width="44" height="20" rx="10" fill="#2563eb"/><text x="378" y="56" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">edit</text>
  <line x1="428" y1="82" x2="454" y2="82" stroke="#334e68" stroke-width="1.5" stroke-dasharray="4 4"/><text x="441" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#334e68">✗</text>

  <rect x="456" y="52" width="176" height="60" rx="8" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <text x="544" y="76" text-anchor="middle" font-size="11" font-weight="600" fill="#243b53">recorded, crash</text>
  <text x="544" y="96" text-anchor="middle" font-size="10" fill="#627d98">step 3 · h3</text>

  <!-- two resumes -->
  <rect x="24" y="160" width="320" height="110" rx="8" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <text x="40" y="184" font-size="12" font-weight="700" fill="#243b53">naive resume: trust the log</text>
  <text x="40" y="208" font-size="11" fill="#627d98">reads the decision as "approved"</text>
  <text x="40" y="232" font-size="12.5" font-weight="700" fill="#334e68">✗</text>
  <text x="58" y="232" font-size="11.5" fill="#243b53">issues the refund the human denied</text>
  <text x="40" y="254" font-size="10" fill="#627d98">a replayed decision is only as trustworthy as its store</text>

  <rect x="356" y="160" width="320" height="110" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="372" y="184" font-size="12" font-weight="700" fill="#243b53">resume-verify: recheck the chain</text>
  <text x="372" y="208" font-size="11" fill="#627d98">edited step's hash no longer matches</text>
  <text x="372" y="232" font-size="12.5" font-weight="700" fill="#2563eb">✓</text>
  <text x="390" y="232" font-size="11.5" fill="#243b53">resume refused on a tampered checkpoint</text>
  <text x="372" y="254" font-size="10" fill="#627d98">a clean log resumes; the real decision, "denied", stands</text>

  <text x="350" y="300" text-anchor="middle" font-size="11" fill="#627d98">integrity for the agent's memory of itself: tampering shows up on the next read, not only in the act.</text>
</svg>
