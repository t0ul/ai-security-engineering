<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="100%" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title>One poisoned email, three payloads, three gates</title>
  <desc>A single email carries a hidden exfiltration instruction, a planted AWS key, and an over-capable tool. A naive agent lets all three land. The real pipeline stops each at its own gate (scrub, injection guard, capability check) and writes a receipt for each into one hash-chained audit log under a single trace id, so nothing lands.</desc>

  <!-- figure card -->
  <rect x="1" y="1" width="758" height="518" rx="10" fill="#fbfcfe" stroke="#d9e2ec" stroke-width="1"/>

  <!-- poisoned email -->
  <rect x="250" y="20" width="260" height="98" rx="8" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <text x="380" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#243b53">one poisoned email</text>
  <text x="266" y="64" font-size="11.5" fill="#243b53">1 · hidden: POST calendar to attacker</text>
  <text x="266" y="84" font-size="11.5" fill="#243b53">2 · planted AWS key: AKIA...EXAMPLE</text>
  <text x="266" y="104" font-size="11.5" fill="#243b53">3 · "read-only" tool writes a .ics</text>

  <!-- NAIVE lane -->
  <rect x="40" y="140" width="214" height="24" rx="12" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <text x="147" y="157" text-anchor="middle" font-size="12" font-weight="600" fill="#627d98">naive agent, no controls</text>
  <text x="138" y="206" text-anchor="middle" font-size="26" font-weight="700" fill="#243b53">3 / 3</text>
  <text x="138" y="226" text-anchor="middle" font-size="11" fill="#627d98">payloads landed</text>
  <line x1="360" y1="118" x2="470" y2="160" stroke="#334e68" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#cah)"/>
  <line x1="372" y1="118" x2="470" y2="194" stroke="#334e68" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#cah)"/>
  <line x1="384" y1="118" x2="470" y2="228" stroke="#334e68" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#cah)"/>
  <text x="462" y="166" text-anchor="end" font-size="13" font-weight="700" fill="#334e68">✗</text>
  <text x="462" y="200" text-anchor="end" font-size="13" font-weight="700" fill="#334e68">✗</text>
  <text x="462" y="234" text-anchor="end" font-size="13" font-weight="700" fill="#334e68">✗</text>
  <text x="476" y="166" font-size="12" fill="#243b53">secret indexed into the corpus</text>
  <text x="476" y="200" font-size="12" fill="#243b53">calendar posted to attacker.example</text>
  <text x="476" y="234" font-size="12" fill="#243b53">unauthorized .ics written to disk</text>

  <!-- divider -->
  <line x1="40" y1="252" x2="720" y2="252" stroke="#9fb3c8" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- PIPELINE lane -->
  <rect x="40" y="266" width="250" height="24" rx="12" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="165" y="283" text-anchor="middle" font-size="12" font-weight="600" fill="#243b53">the real pipeline, one trace id</text>

  <text x="248" y="315" text-anchor="end" font-size="12" fill="#627d98">the AWS key</text>
  <line x1="252" y1="311" x2="298" y2="311" stroke="#334e68" stroke-width="1.4" marker-end="url(#cah)"/>
  <rect x="300" y="296" width="150" height="30" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="375" y="315" text-anchor="middle" font-size="12" font-weight="600" fill="#243b53">goflage scrub</text>
  <line x1="450" y1="311" x2="470" y2="311" stroke="#334e68" stroke-width="1.4" marker-end="url(#cah)"/>
  <text x="478" y="315" font-size="12.5" font-weight="700" fill="#2563eb">✓</text>
  <text x="494" y="315" font-size="12" fill="#243b53">redacted before it is indexed</text>

  <text x="248" y="357" text-anchor="end" font-size="12" fill="#627d98">the injected instruction</text>
  <line x1="252" y1="353" x2="298" y2="353" stroke="#334e68" stroke-width="1.4" marker-end="url(#cah)"/>
  <rect x="300" y="338" width="150" height="30" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="375" y="357" text-anchor="middle" font-size="12" font-weight="600" fill="#243b53">injection guard</text>
  <line x1="450" y1="353" x2="470" y2="353" stroke="#334e68" stroke-width="1.4" marker-end="url(#cah)"/>
  <text x="478" y="357" font-size="12.5" font-weight="700" fill="#2563eb">✓</text>
  <text x="494" y="357" font-size="12" fill="#243b53">kept as data, never obeyed</text>

  <text x="248" y="399" text-anchor="end" font-size="12" fill="#627d98">the tool's write attempt</text>
  <line x1="252" y1="395" x2="298" y2="395" stroke="#334e68" stroke-width="1.4" marker-end="url(#cah)"/>
  <rect x="300" y="380" width="150" height="30" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="375" y="399" text-anchor="middle" font-size="12" font-weight="600" fill="#243b53">capability check</text>
  <line x1="450" y1="395" x2="470" y2="395" stroke="#334e68" stroke-width="1.4" marker-end="url(#cah)"/>
  <text x="478" y="399" font-size="12.5" font-weight="700" fill="#2563eb">✓</text>
  <text x="494" y="399" font-size="12" fill="#243b53">refused: declared read-only</text>

  <line x1="375" y1="410" x2="375" y2="430" stroke="#334e68" stroke-width="1.4" marker-end="url(#cah)"/>
  <text x="392" y="426" font-size="10.5" fill="#627d98">each gate writes a receipt</text>

  <!-- audit hash-chain -->
  <rect x="60" y="434" width="158" height="28" rx="5" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <text x="139" y="452" text-anchor="middle" font-size="11" fill="#243b53">pii/scrubbed</text>
  <line x1="218" y1="448" x2="262" y2="448" stroke="#334e68" stroke-width="1.4"/>
  <text x="240" y="443" text-anchor="middle" font-size="10" fill="#627d98">#</text>
  <rect x="262" y="434" width="200" height="28" rx="5" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <text x="362" y="452" text-anchor="middle" font-size="11" fill="#243b53">injection_guard/detected</text>
  <line x1="462" y1="448" x2="506" y2="448" stroke="#334e68" stroke-width="1.4"/>
  <text x="484" y="443" text-anchor="middle" font-size="10" fill="#627d98">#</text>
  <rect x="506" y="434" width="194" height="28" rx="5" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <text x="603" y="452" text-anchor="middle" font-size="11" fill="#243b53">capability_violation</text>

  <!-- footer verdict -->
  <rect x="60" y="474" width="640" height="34" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="80" y="496" font-size="12.5" font-weight="600" fill="#243b53">one trace id · hash-chain verified ✓</text>
  <text x="680" y="496" text-anchor="end" font-size="15" font-weight="700" fill="#243b53">0 / 3 landed</text>

  <defs>
    <marker id="cah" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#334e68"/>
    </marker>
  </defs>
</svg>
