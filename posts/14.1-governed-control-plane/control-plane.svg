<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title>A governed control plane</title>
  <desc>Changing the agent's prompts is a privileged action. Each subject presents a signed grant; the control plane verifies it covers write on prompts. The app role's grant covers only list on the corpus, so it is refused; the operator's grant covers write on prompts, so the change is applied and versioned. Both attempts, the refusal and the approval, are written to a hash-chained audit attributed to the subject.</desc>
  <rect x="1" y="1" width="698" height="418" rx="10" fill="#fbfcfe" stroke="#d9e2ec" stroke-width="1"/>

  <!-- subjects -->
  <rect x="24" y="70" width="196" height="58" rx="8" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <text x="40" y="92" font-size="12" font-weight="700" fill="#243b53">app role</text>
  <text x="40" y="112" font-size="10.5" fill="#627d98">grant: list · corpus</text>

  <rect x="24" y="200" width="196" height="58" rx="8" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <text x="40" y="222" font-size="12" font-weight="700" fill="#243b53">operator</text>
  <text x="40" y="242" font-size="10.5" fill="#627d98">grant: write · prompts</text>

  <!-- gate -->
  <line x1="220" y1="99" x2="296" y2="150" stroke="#334e68" stroke-width="1.5" marker-end="url(#cph)"/>
  <line x1="220" y1="229" x2="296" y2="178" stroke="#334e68" stroke-width="1.5" marker-end="url(#cph)"/>
  <rect x="298" y="118" width="150" height="92" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="373" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#243b53">control plane</text>
  <text x="373" y="168" text-anchor="middle" font-size="10.5" fill="#627d98">authz.Verify</text>
  <text x="373" y="190" text-anchor="middle" font-size="10.5" fill="#627d98">covers write</text>
  <text x="373" y="204" text-anchor="middle" font-size="10.5" fill="#627d98">on prompts?</text>

  <!-- refused (app) -->
  <line x1="448" y1="150" x2="500" y2="120" stroke="#334e68" stroke-width="1.5" marker-end="url(#cph)"/>
  <text x="508" y="116" font-size="12.5" font-weight="700" fill="#334e68">✗</text>
  <text x="524" y="116" font-size="11" fill="#243b53">refused: grant scope</text>
  <text x="524" y="132" font-size="10" fill="#627d98">(list/corpus, not write/prompts)</text>

  <!-- applied (operator) -->
  <line x1="448" y1="178" x2="500" y2="208" stroke="#2563eb" stroke-width="1.6" marker-end="url(#cpb)"/>
  <text x="508" y="212" font-size="12.5" font-weight="700" fill="#2563eb">✓</text>
  <rect x="524" y="192" width="152" height="42" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="600" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#243b53">prompts (the agent's</text>
  <text x="600" y="225" text-anchor="middle" font-size="11" font-weight="600" fill="#243b53">instructions) · v1</text>

  <!-- audit -->
  <text x="26" y="302" font-size="11" font-weight="700" fill="#627d98">ADMIN AUDIT (hash-chained, attributed)</text>
  <rect x="24" y="314" width="300" height="40" rx="6" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <text x="174" y="338" text-anchor="middle" font-size="10.5" fill="#243b53">prompt_change_denied · by: app</text>
  <line x1="324" y1="334" x2="360" y2="334" stroke="#334e68" stroke-width="1.4"/>
  <text x="342" y="329" text-anchor="middle" font-size="10" fill="#627d98">#</text>
  <rect x="362" y="314" width="312" height="40" rx="6" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <text x="518" y="338" text-anchor="middle" font-size="10.5" fill="#243b53">prompt_changed · by: operator · v1</text>
  <text x="350" y="386" text-anchor="middle" font-size="11" fill="#243b53">a leaked data-path credential cannot rewrite the agent's brain. audit chain verified <tspan font-weight="700" fill="#2563eb">✓</tspan></text>

  <defs>
    <marker id="cph" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#334e68"/></marker>
    <marker id="cpb" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>
  </defs>
</svg>
