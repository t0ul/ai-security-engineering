<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="100%" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title>The detonation chamber</title>
  <desc>The agent runs a model-suggested command inside an ephemeral virtual machine that has no view of the host filesystem, a read-only disk, and no network card. The command that owned the Mac a chapter ago cannot write to disk, reach the host, or phone home.</desc>
  <rect x="1" y="1" width="698" height="398" rx="10" fill="#fbfcfe" stroke="#d9e2ec" stroke-width="1"/>

  <!-- host -->
  <rect x="26" y="70" width="190" height="258" rx="8" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <text x="121" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#243b53">Your Mac (host)</text>
  <text x="46" y="134" font-size="12" fill="#627d98">• your files</text>
  <text x="46" y="160" font-size="12" fill="#627d98">• your network</text>
  <text x="46" y="186" font-size="12" fill="#627d98">• your data</text>
  <text x="46" y="212" font-size="12" fill="#627d98">• the real agent</text>

  <!-- boundary wall -->
  <line x1="258" y1="70" x2="258" y2="328" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="266" y1="70" x2="266" y2="328" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="4 4"/>
  <text x="262" y="352" text-anchor="middle" font-size="10.5" fill="#2563eb" font-weight="600">no path to host</text>

  <!-- chamber -->
  <rect x="300" y="70" width="374" height="258" rx="8" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <text x="487" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#243b53">Detonation chamber</text>
  <text x="487" y="111" text-anchor="middle" font-size="11" fill="#627d98">ephemeral, disposable VM</text>
  <rect x="320" y="126" width="334" height="36" rx="6" fill="#eef4ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="487" y="149" text-anchor="middle" font-size="12" font-weight="600" fill="#243b53">a model-suggested command runs here</text>

  <text x="320" y="196" font-size="12" fill="#243b53">write OWNED to disk</text>
  <text x="560" y="196" font-size="12.5" font-weight="700" fill="#334e68">✗</text>
  <text x="576" y="196" font-size="11" fill="#627d98">disk is read-only</text>

  <text x="320" y="228" font-size="12" fill="#243b53">write onto the host</text>
  <text x="560" y="228" font-size="12.5" font-weight="700" fill="#334e68">✗</text>
  <text x="576" y="228" font-size="11" fill="#627d98">no path out</text>

  <text x="320" y="260" font-size="12" fill="#243b53">phone home / exfil</text>
  <text x="560" y="260" font-size="12.5" font-weight="700" fill="#334e68">✗</text>
  <text x="576" y="260" font-size="11" fill="#627d98">no network card</text>

  <text x="320" y="300" font-size="11" fill="#627d98">only interface: loopback (lo). no host filesystem, no NIC.</text>
</svg>
