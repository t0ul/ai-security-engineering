<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="100%" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title>GORED: a model as attacker, an oracle it cannot forge</title>
  <desc>A small local model plays attacker against a target app. Against the vulnerable build, an object-level access bug lets a low-privilege session read an admin note and the oracle records the capture at the real exploit site. Against the hardened build, a per-record ownership check refuses the note and the oracle records nothing. The oracle holds a secret only the target can reveal, so the model's claims of success do not count.</desc>
  <rect x="1" y="1" width="698" height="328" rx="10" fill="#fbfcfe" stroke="#d9e2ec" stroke-width="1"/>

  <rect x="24" y="118" width="150" height="86" rx="8" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <text x="99" y="150" text-anchor="middle" font-size="12.5" font-weight="700" fill="#243b53">adversary</text>
  <text x="99" y="168" text-anchor="middle" font-size="10.5" fill="#627d98">a small local</text>
  <text x="99" y="182" text-anchor="middle" font-size="10.5" fill="#627d98">model, attacking</text>

  <!-- vulnerable path -->
  <line x1="174" y1="140" x2="214" y2="98" stroke="#334e68" stroke-width="1.5" marker-end="url(#grh)"/>
  <rect x="216" y="58" width="236" height="56" rx="8" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <text x="334" y="80" text-anchor="middle" font-size="11.5" font-weight="600" fill="#243b53">vulnerable build: session check only</text>
  <text x="334" y="100" text-anchor="middle" font-size="10" fill="#627d98">GET /api/notes/1000 serves the admin note</text>
  <line x1="452" y1="86" x2="492" y2="86" stroke="#334e68" stroke-width="1.5" marker-end="url(#grh)"/>
  <text x="500" y="82" font-size="12" font-weight="700" fill="#334e68">captured</text>
  <text x="500" y="98" font-size="10" fill="#627d98">flag discloses</text>

  <!-- hardened path -->
  <line x1="174" y1="182" x2="214" y2="224" stroke="#334e68" stroke-width="1.5" marker-end="url(#grh)"/>
  <rect x="216" y="208" width="236" height="56" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="334" y="230" text-anchor="middle" font-size="11.5" font-weight="600" fill="#243b53">hardened build: + ownership check</text>
  <text x="334" y="250" text-anchor="middle" font-size="10" fill="#627d98">the note is refused to the wrong session</text>
  <line x1="452" y1="236" x2="492" y2="236" stroke="#2563eb" stroke-width="1.6" marker-end="url(#grb)"/>
  <text x="500" y="232" font-size="12" font-weight="700" fill="#2563eb">✓ empty</text>
  <text x="500" y="248" font-size="10" fill="#627d98">no capture</text>

  <!-- oracle -->
  <rect x="150" y="286" width="420" height="30" rx="8" fill="#ffffff" stroke="#334e68" stroke-width="1.3"/>
  <text x="360" y="305" text-anchor="middle" font-size="10.5" fill="#243b53">the oracle holds a secret only the target can reveal. the model's claim of success does not count.</text>
  <defs>
    <marker id="grh" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#334e68"/></marker>
    <marker id="grb" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>
  </defs>
</svg>
