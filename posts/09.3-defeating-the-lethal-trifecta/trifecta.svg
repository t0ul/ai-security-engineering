<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title>The lethal trifecta, cut leg by leg</title>
  <desc>The attack chain: a hidden instruction fetches credentials from the cloud metadata service, then posts them to an attacker. Three controls each sever the chain on their own: netpolicy refuses the metadata and attacker hosts, captoken refuses the token-less action, and argcheck refuses a smuggled command. To complete the chain an attacker must beat all three at once.</desc>
  <rect x="1" y="1" width="698" height="418" rx="10" fill="#fbfcfe" stroke="#d9e2ec" stroke-width="1"/>

  <!-- the chain -->
  <text x="26" y="48" font-size="11" font-weight="700" fill="#627d98">THE CHAIN</text>
  <rect x="24" y="60" width="188" height="56" rx="8" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <text x="118" y="82" text-anchor="middle" font-size="11.5" font-weight="600" fill="#243b53">hidden instruction</text>
  <text x="118" y="100" text-anchor="middle" font-size="10" fill="#627d98">(untrusted email)</text>

  <line x1="212" y1="88" x2="252" y2="88" stroke="#334e68" stroke-width="1.5" marker-end="url(#tah)"/>
  <rect x="254" y="60" width="188" height="56" rx="8" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <text x="348" y="82" text-anchor="middle" font-size="11.5" font-weight="600" fill="#243b53">169.254.169.254</text>
  <text x="348" y="100" text-anchor="middle" font-size="10" fill="#627d98">metadata creds (private data)</text>

  <line x1="442" y1="88" x2="482" y2="88" stroke="#334e68" stroke-width="1.5" marker-end="url(#tah)"/>
  <rect x="484" y="60" width="190" height="56" rx="8" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <text x="579" y="82" text-anchor="middle" font-size="11.5" font-weight="600" fill="#243b53">attacker.example</text>
  <text x="579" y="100" text-anchor="middle" font-size="10" fill="#627d98">exfil (act outward)</text>

  <!-- controls cut it -->
  <text x="26" y="166" font-size="11" font-weight="700" fill="#627d98">EACH CONTROL CUTS A LEG (any one breaks the chain)</text>

  <rect x="24" y="182" width="650" height="52" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="40" y="203" font-size="12" font-weight="700" fill="#2563eb">netpolicy</text>
  <text x="40" y="221" font-size="11" fill="#243b53">egress default-deny: the metadata host and the attacker host are both refused</text>
  <text x="648" y="213" text-anchor="end" font-size="13" font-weight="700" fill="#334e68">✗</text>

  <rect x="24" y="244" width="650" height="52" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="40" y="265" font-size="12" font-weight="700" fill="#2563eb">captoken</text>
  <text x="40" y="283" font-size="11" fill="#243b53">the fetch needs a scoped net:fetch token; an injected instruction carries none</text>
  <text x="648" y="275" text-anchor="end" font-size="13" font-weight="700" fill="#334e68">✗</text>

  <rect x="24" y="306" width="650" height="52" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="40" y="327" font-size="12" font-weight="700" fill="#2563eb">argcheck</text>
  <text x="40" y="345" font-size="11" fill="#243b53">argv is validated element by element; a smuggled second command is refused</text>
  <text x="648" y="337" text-anchor="end" font-size="13" font-weight="700" fill="#334e68">✗</text>

  <text x="350" y="390" text-anchor="middle" font-size="11.5" fill="#243b53">to complete the chain an attacker must beat <tspan font-weight="700">all three at once</tspan>. what left the machine: <tspan font-weight="700" fill="#2563eb">nothing</tspan>.</text>

  <defs><marker id="tah" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#334e68"/></marker></defs>
</svg>
